[workspace]
members = [
    "crates/vmkit",
    "crates/mu-ir",
    "crates/mu-utils",
    "crates/context", "crates/derive", "crates/bitfield",


]
default-members = ["crates/vmkit", "crates/context", "crates/derive", "crates/bitfield"]

resolver = "2"

[workspace.dependencies]
num = "1.0"
cranelift-entity = "0.112"
dashmap = "6.0"
parking_lot = "0.12"
paste = "*"
mu-utils = { path = "crates/mu-utils" }
smallvec = "*"
swapstack = { path = "crates/swapstack" }
vmkit-context = { path = "crates/context" }
